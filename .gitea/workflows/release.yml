# =============================================================================
# .gitea/workflows/release.yml — BackupHelper
#
# Conventional-commits-driven SemVer + Gitea Release pipeline.
#
# ASSUMPTIONS YOU MAY NEED TO EDIT:
#   - `runs-on: ubuntu-latest` below. If your self-hosted runner uses a
#     different label (e.g. `self-hosted`, `homelab-linux`), change all jobs.
#   - The `RELEASE_TOKEN` secret must exist (PAT with repo:write scope).
#     The auto-provisioned GITEA_TOKEN often cannot push tags.
#     Create at: https://gitea.lan/user/settings/applications -> Generate New Token
#     Add via Repo Settings -> Actions -> Secrets as RELEASE_TOKEN.
#   - NuGet publishing is OFF by default (no feed configured yet).
#     To enable, run workflow manually with `publish_nuget: true` and
#     configure either NUGET_API_KEY (nuget.org) or GITEA_NUGET_SOURCE +
#     GITEA_NUGET_API_KEY (self-hosted Gitea package registry).
#
# CONVENTIONAL COMMIT BUMP RULES (applied to commits since the last v* tag):
#   - BREAKING CHANGE / `feat!:` / `fix!:` -> MAJOR
#   - feat:                                -> MINOR
#   - fix:, perf:, refactor:               -> PATCH
#   - chore:, docs:, ci:, test:, style:, build: -> no bump
# =============================================================================
name: release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute version and build, but do not tag or publish a release"
        type: boolean
        default: false
      version_override:
        description: "Force this exact version (e.g. 1.2.3). Leave blank for auto-calculated."
        type: string
        default: ""
      publish_nuget:
        description: "Pack and push library projects to NuGet feed (requires secrets)"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  DOTNET_VERSION: "9.0.x"
  SOLUTION: "BackupHelper.sln"
  CONSOLE_PROJECT: "src/BackupHelper.ConsoleApp/BackupHelper.ConsoleApp.csproj"
  APP_NAME: "backuphelper"
  # Library projects to pack as NuGet packages (when publish_nuget=true).
  # Edit this list as your library set evolves.
  NUGET_PROJECTS: |
    src/BackupHelper.Abstractions/BackupHelper.Abstractions.csproj
    src/BackupHelper.Core/BackupHelper.Core.csproj
    src/BackupHelper.Sinks.Abstractions/BackupHelper.Sinks.Abstractions.csproj
    src/BackupHelper.Sinks.Azure/BackupHelper.Sinks.Azure.csproj
    src/BackupHelper.Sinks.FileSystem/BackupHelper.Sinks.FileSystem.csproj
    src/BackupHelper.Sinks.SMB/BackupHelper.Sinks.SMB.csproj
    src/BackupHelper.Sources.Abstractions/BackupHelper.Sources.Abstractions.csproj
    src/BackupHelper.Sources.FileSystem/BackupHelper.Sources.FileSystem.csproj
    src/BackupHelper.Sources.SMB/BackupHelper.Sources.SMB.csproj
    src/BackupHelper.Connectors.Azure/BackupHelper.Connectors.Azure.csproj
    src/BackupHelper.Connectors.SMB/BackupHelper.Connectors.SMB.csproj

jobs:
  # ---------------------------------------------------------------------------
  # 1. version — derive next semver from tags + conventional commits
  # ---------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      previous_tag: ${{ steps.semver.outputs.previous_tag }}
      should_release: ${{ steps.semver.outputs.should_release }}
      changelog: ${{ steps.semver.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next semantic version
        id: semver
        shell: bash
        run: |
          set -euo pipefail

          OVERRIDE="${{ github.event.inputs.version_override }}"

          # Only match v<major>.<minor>.<patch>; ignores rc/alpha/garbage tags.
          PREV_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)
          echo "previous_tag=${PREV_TAG:-<none>}" >> "$GITHUB_OUTPUT"

          if [ -n "$OVERRIDE" ]; then
            NEXT="$OVERRIDE"
            BUMP="override"
          else
            if [ -z "$PREV_TAG" ]; then
              # First release ever — seed from 0.0.0 so the first feat bumps to 0.1.0.
              PREV_VERSION="0.0.0"
              COMMITS=$(git log --pretty=format:'%s%n%b%n--END--' || true)
            else
              PREV_VERSION="${PREV_TAG#v}"
              COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:'%s%n%b%n--END--' || true)
            fi

            MAJOR=$(echo "$PREV_VERSION" | cut -d. -f1)
            MINOR=$(echo "$PREV_VERSION" | cut -d. -f2)
            PATCH=$(echo "$PREV_VERSION" | cut -d. -f3)

            BUMP="none"
            if echo "$COMMITS" | grep -qE '^[a-zA-Z]+(\([^)]+\))?!:' \
               || echo "$COMMITS" | grep -qE '^BREAKING CHANGE:'; then
              BUMP="major"
            elif echo "$COMMITS" | grep -qE '^feat(\([^)]+\))?:'; then
              BUMP="minor"
            elif echo "$COMMITS" | grep -qE '^(fix|perf|refactor)(\([^)]+\))?:'; then
              BUMP="patch"
            fi

            case "$BUMP" in
              major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR+1)); PATCH=0 ;;
              patch) PATCH=$((PATCH+1)) ;;
              none)  : ;;
            esac
            NEXT="${MAJOR}.${MINOR}.${PATCH}"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$OVERRIDE" ]; then
            SHOULD_RELEASE="true"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            SHOULD_RELEASE="false"
          elif [ "$BUMP" = "none" ]; then
            SHOULD_RELEASE="false"
          elif git rev-parse "v${NEXT}" >/dev/null 2>&1; then
            echo "::warning::Tag v${NEXT} already exists — skipping release."
            SHOULD_RELEASE="false"
          else
            SHOULD_RELEASE="true"
          fi

          # Build changelog
          {
            echo "## What's changed"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              RANGE="${PREV_TAG}..HEAD"
            else
              RANGE="HEAD"
            fi
            emit_group() {
              local heading="$1" pattern="$2" lines
              lines=$(git log $RANGE --pretty=format:'- %s (%h)' --no-merges | grep -E "$pattern" || true)
              if [ -n "$lines" ]; then
                echo "### $heading"
                echo "$lines"
                echo ""
              fi
            }
            emit_group "Breaking changes" '^- [a-zA-Z]+(\([^)]+\))?!:'
            emit_group "Features"         '^- feat(\([^)]+\))?:'
            emit_group "Fixes"            '^- fix(\([^)]+\))?:'
            emit_group "Performance"      '^- perf(\([^)]+\))?:'
            emit_group "Refactoring"      '^- refactor(\([^)]+\))?:'
            emit_group "Docs"             '^- docs(\([^)]+\))?:'
            emit_group "Other"            '^- (chore|ci|test|style|build)(\([^)]+\))?:'
            if [ -n "$PREV_TAG" ]; then
              echo ""
              echo "**Full changelog**: ${PREV_TAG}...v${NEXT}"
            fi
          } > /tmp/changelog.md

          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"
          {
            echo "changelog<<__EOF_CHANGELOG__"
            cat /tmp/changelog.md
            echo "__EOF_CHANGELOG__"
          } >> "$GITHUB_OUTPUT"

          echo ""
          echo "=== Version ==="
          echo "Previous tag:  ${PREV_TAG:-<none>}"
          echo "Bump:          $BUMP"
          echo "Next version:  $NEXT"
          echo "Should release: $SHOULD_RELEASE"
          echo "================"

  # ---------------------------------------------------------------------------
  # 2. test — restore, build, run all test projects
  # ---------------------------------------------------------------------------
  test:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build (Release)
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore -p:Version=${{ needs.version.outputs.version }}

      - name: Test
        run: dotnet test ${{ env.SOLUTION }} -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: ./TestResults
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. package-console — self-contained EXE + ZIP for each RID
  # ---------------------------------------------------------------------------
  package-console:
    needs: [version, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, linux-x64]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Publish ConsoleApp (${{ matrix.rid }})
        run: |
          dotnet publish "${{ env.CONSOLE_PROJECT }}" \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:PublishTrimmed=false \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:Version=${VERSION} \
            -p:AssemblyVersion=${VERSION}.0 \
            -p:FileVersion=${VERSION}.0 \
            -p:InformationalVersion=${VERSION} \
            -o "publish/${{ matrix.rid }}"

      - name: Create ZIP archive
        run: |
          mkdir -p artifacts
          cd "publish/${{ matrix.rid }}"
          zip -r "../../artifacts/${{ env.APP_NAME }}-${VERSION}-${{ matrix.rid }}.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: release-artifacts
          path: artifacts/*.zip
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 4. package-nuget — pack library projects (gated)
  # ---------------------------------------------------------------------------
  package-nuget:
    needs: [version, test]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_nuget == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Pack library projects
        run: |
          mkdir -p nupkgs
          while IFS= read -r proj; do
            [ -z "$proj" ] && continue
            echo "Packing $proj..."
            dotnet pack "$proj" \
              -c Release \
              -p:PackageVersion=${VERSION} \
              -p:Version=${VERSION} \
              -p:IncludeSymbols=true \
              -p:SymbolPackageFormat=snupkg \
              -o nupkgs
          done <<< "${{ env.NUGET_PROJECTS }}"

      - name: Push to NuGet feed
        env:
          NUGET_SOURCE: ${{ secrets.GITEA_NUGET_SOURCE }}     # e.g. https://gitea.lan/api/packages/SlawomirKalandyk/nuget/index.json
          GITEA_API_KEY: ${{ secrets.GITEA_NUGET_API_KEY }}   # PAT with package:write
          NUGET_ORG_KEY: ${{ secrets.NUGET_API_KEY }}         # only if pushing to nuget.org
        run: |
          set -euo pipefail
          shopt -s nullglob
          PACKAGES=(nupkgs/*.nupkg)
          if [ ${#PACKAGES[@]} -eq 0 ]; then
            echo "No .nupkg files produced — nothing to push."
            exit 0
          fi

          if [ -n "${NUGET_SOURCE:-}" ] && [ -n "${GITEA_API_KEY:-}" ]; then
            echo "Pushing to Gitea NuGet feed: ${NUGET_SOURCE}"
            for pkg in "${PACKAGES[@]}"; do
              dotnet nuget push "$pkg" \
                --api-key "${GITEA_API_KEY}" \
                --source "${NUGET_SOURCE}" \
                --skip-duplicate
            done
          elif [ -n "${NUGET_ORG_KEY:-}" ]; then
            echo "Pushing to nuget.org"
            for pkg in "${PACKAGES[@]}"; do
              dotnet nuget push "$pkg" \
                --api-key "${NUGET_ORG_KEY}" \
                --source https://api.nuget.org/v3/index.json \
                --skip-duplicate
            done
          else
            echo "::error::publish_nuget=true but no NuGet feed secrets are configured."
            echo "Set GITEA_NUGET_SOURCE + GITEA_NUGET_API_KEY, or NUGET_API_KEY."
            exit 1
          fi

      - name: Upload nupkgs as artifact
        uses: actions/upload-artifact@v3
        with:
          name: nuget-packages
          path: nupkgs/*.nupkg
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 5. release — tag, create Gitea release, attach assets
  # ---------------------------------------------------------------------------
  release:
    needs: [version, package-console]
    if: needs.version.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CHANGELOG: ${{ needs.version.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          name: release-artifacts
          path: artifacts

      - name: Create + push annotated tag
        run: |
          git config user.name  "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@users.noreply.gitea.lan"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create Gitea release + upload assets
        env:
          GITEA_SERVER: ${{ github.server_url }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          BODY=$(jq -Rs . <<<"$CHANGELOG")
          PAYLOAD=$(cat <<JSON
          {
            "tag_name": "v${VERSION}",
            "name": "v${VERSION}",
            "body": ${BODY},
            "draft": false,
            "prerelease": false
          }
          JSON
          )
          RELEASE_ID=$(curl -fsS \
            -H "Authorization: token ${TOKEN}" \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$PAYLOAD" \
            "${GITEA_SERVER}/api/v1/repos/${OWNER}/${REPO}/releases" | jq -r '.id')

          echo "Created release id=${RELEASE_ID}"

          for asset in artifacts/*.zip; do
            echo "Uploading $asset..."
            curl -fsS \
              -H "Authorization: token ${TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${asset}" \
              "${GITEA_SERVER}/api/v1/repos/${OWNER}/${REPO}/releases/${RELEASE_ID}/assets?name=$(basename "$asset")"
          done
